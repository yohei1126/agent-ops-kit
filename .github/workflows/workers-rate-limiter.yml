# Run the Durable Object rate limiter template tests on PRs and pushes to main.
name: Workers rate limiter

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: templates/workers-do-rate-limiter

jobs:
  workers-rate-limiter:
    name: workers-rate-limiter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5.1.0. The repository requires a full commit SHA.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node
        # v7.1.0. The repository requires a full commit SHA.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Test
        run: npx --no-install vitest run
