# Run the local dev loop gate checks on PRs and pushes to main.
name: Dev loop gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: dev-loop-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5.1.0. The repository requires a full commit SHA.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check shell syntax
        run: bash -n scripts/dev-loop-gate.sh scripts/lib/pr-state.sh scripts/lib/docs-sweep.sh scripts/lib/deploy-hash.sh scripts/agy-review-launch.sh scripts/lib/agy-settings-check.sh scripts/rate-limit-check.sh scripts/worker-deploy.sh scripts/tests/test_agy_review_launch.sh scripts/tests/test_pr_state.sh scripts/tests/test_deploy_hash.sh scripts/tests/test_rate_limit_check.sh scripts/tests/test_worker_deploy.sh

      - name: Run shellcheck
        run: shellcheck -x scripts/dev-loop-gate.sh scripts/lib/pr-state.sh scripts/lib/docs-sweep.sh scripts/lib/deploy-hash.sh scripts/agy-review-launch.sh scripts/lib/agy-settings-check.sh scripts/rate-limit-check.sh scripts/worker-deploy.sh scripts/tests/test_dev_loop_gate.sh scripts/tests/test_agy_review_launch.sh scripts/tests/test_pr_state.sh scripts/tests/test_docs_sweep.sh scripts/tests/test_deploy_hash.sh scripts/tests/test_rate_limit_check.sh scripts/tests/test_worker_deploy.sh

      - name: Run gate tests
        run: |
          bash scripts/tests/test_dev_loop_gate.sh
          bash scripts/tests/test_agy_review_launch.sh
          bash scripts/tests/test_pr_state.sh
          bash scripts/tests/test_deploy_hash.sh
          bash scripts/tests/test_rate_limit_check.sh
          bash scripts/tests/test_worker_deploy.sh

      - name: Run quota dump tests
        run: python3 -m unittest scripts/quota/test_quota_dump.py

      - name: Run docs sweep tests
        run: bash scripts/tests/test_docs_sweep.sh

      - name: Check Markdown line caps
        run: scripts/dev-loop-gate.sh --strict --check line-cap

      - name: Check docs sweep
        run: scripts/dev-loop-gate.sh --strict --check docs-sweep
