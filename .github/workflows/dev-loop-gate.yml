# Run the local dev loop gate checks on PRs and pushes to main.
name: Dev loop gate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: dev-loop-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v5.1.0. The repository requires a full commit SHA.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check shell syntax
        run: bash -n scripts/dev-loop-gate.sh scripts/lib/pr-state.sh scripts/lib/docs-sweep.sh scripts/lib/model-ids.sh scripts/lib/model-check-required.sh scripts/tests/test_model_check_required.sh scripts/lib/agent-git.sh scripts/tests/test_agent_git.sh scripts/tests/test_model_ids.sh scripts/tests/test_arg_boundaries.sh scripts/lib/deploy-hash.sh scripts/agy-review-launch.sh scripts/agy-docs-launch.sh scripts/agy-docs-collect.sh scripts/lib/agy-settings-check.sh scripts/lib/agy-launch-run.sh scripts/lib/launch-run.sh scripts/lib/agent-config.sh scripts/agent-launch.sh scripts/agents/agy/run scripts/agents/agy/collect scripts/agents/agy/quota scripts/rate-limit-check.sh scripts/worker-deploy.sh scripts/dependabot-red-prs.sh scripts/agent-task-issue.sh scripts/work-graph.sh scripts/tests/test_agy_review_launch.sh scripts/tests/test_agy_docs_launch.sh scripts/tests/test_agent_config.sh scripts/tests/test_agent_launch.sh scripts/tests/test_agent_launch_equivalence.sh scripts/tests/test_pr_state.sh scripts/tests/test_deploy_hash.sh scripts/tests/test_rate_limit_check.sh scripts/tests/test_worker_deploy.sh scripts/tests/test_dependabot_red_prs.sh scripts/tests/test_agent_task_issue.sh scripts/tests/test_work_graph.sh scripts/lib/docs-usage-dup.sh scripts/tests/test_docs_usage_dup.sh

      - name: Run shellcheck
        run: shellcheck -x scripts/dev-loop-gate.sh scripts/lib/pr-state.sh scripts/lib/docs-sweep.sh scripts/lib/model-ids.sh scripts/lib/model-check-required.sh scripts/tests/test_model_check_required.sh scripts/lib/agent-git.sh scripts/tests/test_agent_git.sh scripts/tests/test_model_ids.sh scripts/tests/test_arg_boundaries.sh scripts/lib/deploy-hash.sh scripts/agy-review-launch.sh scripts/agy-docs-launch.sh scripts/agy-docs-collect.sh scripts/lib/agy-settings-check.sh scripts/lib/agy-launch-run.sh scripts/lib/launch-run.sh scripts/lib/agent-config.sh scripts/agent-launch.sh scripts/agents/agy/run scripts/agents/agy/collect scripts/agents/agy/quota scripts/rate-limit-check.sh scripts/worker-deploy.sh scripts/dependabot-red-prs.sh scripts/agent-task-issue.sh scripts/work-graph.sh scripts/tests/test_dev_loop_gate.sh scripts/tests/test_agy_review_launch.sh scripts/tests/test_agy_docs_launch.sh scripts/tests/test_agent_config.sh scripts/tests/test_agent_launch.sh scripts/tests/test_agent_launch_equivalence.sh scripts/tests/test_pr_state.sh scripts/tests/test_docs_sweep.sh scripts/tests/test_deploy_hash.sh scripts/tests/test_rate_limit_check.sh scripts/tests/test_worker_deploy.sh scripts/tests/test_dependabot_red_prs.sh scripts/tests/test_agent_task_issue.sh scripts/tests/test_work_graph.sh scripts/lib/docs-usage-dup.sh scripts/tests/test_docs_usage_dup.sh

      - name: Run gate tests
        run: |
          bash scripts/tests/test_dev_loop_gate.sh
          bash scripts/tests/test_model_ids.sh
          bash scripts/tests/test_model_check_required.sh
          bash scripts/tests/test_arg_boundaries.sh
          bash scripts/tests/test_agy_review_launch.sh
          bash scripts/tests/test_agy_docs_launch.sh
          bash scripts/tests/test_agent_config.sh
          bash scripts/tests/test_agent_launch.sh
          bash scripts/tests/test_agent_launch_equivalence.sh
          bash scripts/tests/test_pr_state.sh
          bash scripts/tests/test_deploy_hash.sh
          bash scripts/tests/test_rate_limit_check.sh
          bash scripts/tests/test_worker_deploy.sh
          bash scripts/tests/test_dependabot_red_prs.sh
          bash scripts/tests/test_agent_task_issue.sh
          bash scripts/tests/test_work_graph.sh

      - name: Run quota dump tests
        run: python3 -m unittest scripts/quota/test_quota_dump.py

      - name: Run docs sweep tests
        run: bash scripts/tests/test_docs_sweep.sh

      - name: Run docs usage dup tests
        run: bash scripts/tests/test_docs_usage_dup.sh

      - name: Check Markdown line caps
        run: scripts/dev-loop-gate.sh --strict --check line-cap

      - name: Check docs sweep
        run: scripts/dev-loop-gate.sh --strict --check docs-sweep

      - name: Check docs usage dup
        run: scripts/dev-loop-gate.sh --strict --check docs-usage-dup

      - name: Check verified model ids
        run: scripts/dev-loop-gate.sh --strict --check model-ids

      - name: Run agent git tests
        run: bash scripts/tests/test_agent_git.sh

      - name: Check agent git docs
        run: scripts/dev-loop-gate.sh --strict --check agent-git

  macos:
    name: dev-loop-gate-macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        # v5.1.0. The repository requires a full commit SHA.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check shell syntax with bash 3.2
        run: /bin/bash -n scripts/dev-loop-gate.sh scripts/lib/model-ids.sh scripts/lib/model-check-required.sh scripts/tests/test_model_check_required.sh scripts/lib/agent-git.sh scripts/tests/test_agent_git.sh scripts/tests/test_model_ids.sh scripts/tests/test_arg_boundaries.sh scripts/agent-task-issue.sh scripts/agent-launch.sh scripts/lib/agent-config.sh scripts/lib/launch-run.sh scripts/lib/agy-launch-run.sh scripts/agents/agy/run scripts/agents/agy/collect scripts/agents/agy/quota scripts/agy-docs-launch.sh scripts/agy-review-launch.sh scripts/agy-docs-collect.sh scripts/tests/test_agent_task_issue.sh scripts/tests/test_agent_config.sh scripts/tests/test_agent_launch.sh scripts/tests/test_agent_launch_equivalence.sh scripts/tests/test_agy_docs_launch.sh scripts/tests/test_agy_review_launch.sh scripts/work-graph.sh scripts/tests/test_work_graph.sh scripts/lib/docs-usage-dup.sh scripts/tests/test_docs_usage_dup.sh

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi

      - name: Run shellcheck
        run: shellcheck -x scripts/dev-loop-gate.sh scripts/lib/model-ids.sh scripts/lib/model-check-required.sh scripts/tests/test_model_check_required.sh scripts/lib/agent-git.sh scripts/tests/test_agent_git.sh scripts/tests/test_model_ids.sh scripts/tests/test_arg_boundaries.sh scripts/agent-task-issue.sh scripts/work-graph.sh scripts/agent-launch.sh scripts/lib/agent-config.sh scripts/lib/launch-run.sh scripts/lib/agy-launch-run.sh scripts/agents/agy/run scripts/agents/agy/collect scripts/agents/agy/quota scripts/agy-docs-launch.sh scripts/agy-review-launch.sh scripts/agy-docs-collect.sh scripts/tests/test_agent_task_issue.sh scripts/tests/test_agent_config.sh scripts/tests/test_agent_launch.sh scripts/tests/test_agent_launch_equivalence.sh scripts/tests/test_agy_docs_launch.sh scripts/tests/test_agy_review_launch.sh scripts/tests/test_work_graph.sh scripts/lib/docs-usage-dup.sh scripts/tests/test_docs_usage_dup.sh

      - name: Run agent task issue tests
        run: |
          /bin/bash scripts/tests/test_agent_task_issue.sh
          /bin/bash scripts/tests/test_model_ids.sh
          /bin/bash scripts/tests/test_model_check_required.sh
          /bin/bash scripts/tests/test_arg_boundaries.sh
          /bin/bash scripts/dev-loop-gate.sh --strict --check model-ids
          /bin/bash scripts/tests/test_agent_git.sh
          /bin/bash scripts/dev-loop-gate.sh --strict --check agent-git
          /bin/bash scripts/tests/test_agent_config.sh
          /bin/bash scripts/tests/test_agent_launch.sh
          /bin/bash scripts/tests/test_agent_launch_equivalence.sh
          /bin/bash scripts/tests/test_agy_docs_launch.sh
          /bin/bash scripts/tests/test_agy_review_launch.sh
          /bin/bash scripts/tests/test_work_graph.sh

      - name: Run docs usage dup tests
        run: |
          /bin/bash scripts/tests/test_docs_usage_dup.sh
          /bin/bash scripts/dev-loop-gate.sh --strict --check docs-usage-dup
